services:
  certgen:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - db-certs:/certs
    command: >
      "openssl req -x509 -newkey rsa:2048 -nodes -days 3650
      -keyout /certs/server.key -out /certs/server.crt
      -subj '/CN=db' -addext 'subjectAltName=DNS:db,DNS:localhost'
      && chown 70:70 /certs/server.key /certs/server.crt
      && chmod 600 /certs/server.key
      && chmod 644 /certs/server.crt"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakemeter
      POSTGRES_PASSWORD: lakemeter
      POSTGRES_DB: lakemeter
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    volumes:
      - pgdata:/var/lib/postgresql/data
      - db-certs:/certs:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakemeter -d lakemeter"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      certgen:
        condition: service_completed_successfully

  backend:
    build: ./lakemeter-oss/backend
    # Allows the container to reach host services (e.g. a local
    # OpenAI-compatible proxy like Ollama or a model gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://lakemeter:lakemeter@db:5432/lakemeter?sslmode=require
      LAKEMETER_BOOTSTRAP_DATABASE: "true"
      LAKEMETER_DATABASE_AUTH_MODE: oauth_with_secrets_fallback
      LOCAL_DEV_EMAIL: dev@lakemeter.local
      # OpenAI-compatible chat backend (optional; enables the AI assistant
      # without a Databricks workspace). Leave OPENAI_BASE_URL/OPENAI_API_KEY
      # empty to keep the Databricks FMAPI mode. Set them via a .env file or
      # your shell, e.g.:
      #   OPENAI_BASE_URL=https://api.openai.com/v1
      #   OPENAI_API_KEY=sk-...
      #   OPENAI_MODEL=gpt-4o-mini
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./lakemeter-oss/frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./lakemeter-oss/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  db-certs:
  frontend-node-modules:
